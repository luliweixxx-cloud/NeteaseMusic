# =====================================================================
#  Quantumult X 配置片段 —— 解锁网易云音乐灰色歌曲
# =====================================================================
# ⚠️ 重要：netease_unlock.js 是「脚本文件」，不是配置文件！
#   ❌ 不要把它导入为「配置文件」（否则会报 invalid Line /*）
#   ✅ 正确做法：用 QX 文件管理把它放到 Scripts 目录，
#      或在「重写 → 引用」里选中这个 .js 文件。
#   本 .conf 才是要导入/追加的配置文件。
# =====================================================================

# ---------- 1. MITM 解密 HTTPS（必须） ----------
[MITM]
hostname = music.163.com, interface.music.163.com, *.music.163.com

# ---------- 2. 重写规则：本地脚本改 privilege（免服务器） ----------
[rewrite_local]
# 解锁歌曲详情 / 歌单 / 搜索 / 播放地址 等接口
^https?:\/\/music\.163\.com\/weapi\/(v3\/song\/detail|v6\/playlist\/detail|cloudsearch\/get\/web|v1\/song\/like|song\/enhance\/player\/url).* url script-response-body netease_unlock.js

# ---------- 3. 进阶方案：配合 UnblockNeteaseMusic 真正换源播放 ----------
# 下面的 [proxy] / [policy] / [filter] 是「完整解锁」用的，需要你
# 自己先部署一个 UnblockNeteaseMusic 服务器。纯本地改字段用不到。
#
# 部署 UnblockNeteaseMusic（任意一台能联网的机器 / 本机）：
#   npx unblockneteasemusic -p 8080 -f 123456   # -f 为本地代理鉴权（可选）
# 得到服务器地址，例如  1.2.3.4:8080 （或本机 127.0.0.1:8080）
#
# 然后把下面注释去掉，并改成你的服务器地址：
#
# [proxy]
# UnblockNM = http, 1.2.3.4, 8080, , , , , , , false
#
# [policy]
# static = 网易云解锁, UnblockNM
#
# [filter]
# HOST,music.163.com,网易云解锁
# HOST-SUFFIX,music.163.com,网易云解锁
#
# 原理：网易云所有请求走 UnblockNeteaseMusic 代理，它转发的同
#       时把灰歌音源替换成其它平台（QQ/酷狗/咪咕）的可用链接，
#       客户端就能正常播放了。
#
# =====================================================================
